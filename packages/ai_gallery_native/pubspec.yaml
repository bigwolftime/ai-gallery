name: ai_gallery_native
description: Native photo, embedding, indexing, and sharing bridge for AI Gallery.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.aigallery.nativebridge
        pluginClass: AIGalleryNativePlugin
      ios:
        pluginClass: AIGalleryNativePlugin
